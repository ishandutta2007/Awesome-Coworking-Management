<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0c142b" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#475569" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1deg); }
      }
      @keyframes pulseSlow {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes beaconRing {
        0% { r: 6; opacity: 1; }
        100% { r: 24; opacity: 0; }
      }
      @keyframes beaconRing2 {
        0% { r: 6; opacity: 1; }
        100% { r: 30; opacity: 0; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes shimmerGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      .floating-item-1 { animation: floatSlow 6s ease-in-out infinite; transform-origin: center; }
      .floating-item-2 { animation: floatReverse 7s ease-in-out infinite; transform-origin: center; }
      .pulsing-glow { animation: pulseSlow 4s ease-in-out infinite; }
      .ring-1 { animation: beaconRing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
      .ring-2 { animation: beaconRing2 3s cubic-bezier(0, 0.2, 0.8, 1) infinite 0.8s; }
      .ring-3 { animation: beaconRing 2.8s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.4s; }
      .flowing-dash { stroke-dasharray: 6, 6; animation: dashFlow 2s linear infinite; }
      .shimmer { animation: shimmerGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Light Halos -->
  <circle cx="200" cy="100" r="180" fill="#38bdf8" fill-opacity="0.12" filter="url(#glow-strong)" />
  <circle cx="1020" cy="220" r="220" fill="#818cf8" fill-opacity="0.14" filter="url(#glow-strong)" />
  <circle cx="600" cy="380" r="160" fill="#34d399" fill-opacity="0.08" filter="url(#glow-strong)" />

  <!-- Connected Floor Plan / Network Graph Backdrop (Right Side) -->
  <g class="floating-item-1" opacity="0.85">
    <!-- Connecting Blueprint Flow Lines -->
    <path d="M 820 120 L 930 180 L 1050 140 L 1120 220 L 1040 300 L 920 260 L 820 120 Z" 
          fill="url(#glowGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" class="flowing-dash" />
    <path d="M 930 180 L 1040 300" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5" />
    <path d="M 1050 140 L 920 260" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.5" />
    <path d="M 750 200 L 820 120" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4,4" />
    <path d="M 1040 300 L 1110 340" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4,4" />

    <!-- Node 1: Private Office / Meeting Room -->
    <g transform="translate(820, 120)">
      <circle r="6" fill="#38bdf8" />
      <circle class="ring-1" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="-45" y="-55" width="90" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" fill-opacity="0.9" />
      <text x="0" y="-35" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MEETING ROOM</text>
    </g>

    <!-- Node 2: Hot Desk Pod -->
    <g transform="translate(1050, 140)">
      <circle r="6" fill="#34d399" />
      <circle class="ring-2" fill="none" stroke="#34d399" stroke-width="1.5" />
      <rect x="-40" y="-55" width="80" height="30" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1" fill-opacity="0.9" />
      <text x="0" y="-35" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">HOT DESK 04</text>
    </g>

    <!-- Node 3: Access Gate / RFID -->
    <g transform="translate(930, 180)">
      <circle r="7" fill="#818cf8" />
      <circle class="ring-3" fill="none" stroke="#818cf8" stroke-width="1.5" />
      <rect x="-42" y="20" width="84" height="28" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" fill-opacity="0.9" />
      <text x="0" y="38" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SMART ACCESS</text>
    </g>

    <!-- Node 4: Billing / POS -->
    <g transform="translate(1040, 300)">
      <circle r="6" fill="#f43f5e" />
      <circle class="ring-1" fill="none" stroke="#f43f5e" stroke-width="1.5" />
      <rect x="-45" y="18" width="90" height="28" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1" fill-opacity="0.9" />
      <text x="0" y="36" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">AUTO BILLING</text>
    </g>

    <!-- Node 5: Phone Booth -->
    <g transform="translate(1120, 220)">
      <circle r="5" fill="#fbbf24" />
      <circle class="ring-2" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    </g>

    <g transform="translate(920, 260)">
      <circle r="5" fill="#38bdf8" />
    </g>
  </g>

  <!-- Left Isometric Mini Badge Graphic -->
  <g class="floating-item-2" transform="translate(80, 70)" opacity="0.9">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2" />
    <path d="M 20 44 L 20 28 L 32 20 L 44 28 L 44 44 Z" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 28 44 L 28 32 L 36 32 L 36 44" fill="none" stroke="#34d399" stroke-width="2" />
    <circle cx="32" cy="24" r="2" fill="#818cf8" />
  </g>

  <!-- Central Header Text & Typography -->
  <g transform="translate(160, 105)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="15" cy="15" r="4" fill="#34d399" class="shimmer" />
      <text x="28" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">
        FLEXIBLE WORKSPACE STACK
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      AWESOME COWORKING
    </text>
    <text x="0" y="125" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      MANAGEMENT
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="0.2">
      Curated SaaS Platforms &amp; Open-Source Tools for Modern Coworking, Flex Offices &amp; Hybrid Spaces
    </text>

    <!-- Bottom Feature Tags / Pills -->
    <g transform="translate(0, 195)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📅 Desk &amp; Room Booking</text>
      </g>

      <!-- Tag 2 -->
      <g transform="translate(178, 0)">
        <rect x="0" y="0" width="160" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💳 Membership &amp; Billing</text>
      </g>

      <!-- Tag 3 -->
      <g transform="translate(348, 0)">
        <rect x="0" y="0" width="152" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔒 IoT &amp; Access Control</text>
      </g>

      <!-- Tag 4 -->
      <g transform="translate(510, 0)">
        <rect x="0" y="0" width="140" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">👥 Community &amp; CRM</text>
      </g>
    </g>
  </g>

  <!-- Sleek Top and Bottom Border Glow -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accentGrad)" opacity="0.8" />
  <rect x="0" y="418" width="1200" height="2" fill="url(#accentGrad)" opacity="0.8" />
</svg>
